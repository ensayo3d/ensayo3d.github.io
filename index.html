<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ensayo 3D · Catálogo</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--tx:#1d1d1f;--mut:#6b6b72;--ac:#ff6a2b;--ac2:#fff1ea;--bd:#e8e6e1;--wa:#25d366;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1e1e22;--tx:#f2f2f4;--mut:#9a9aa3;--ac2:#2c1d15;--bd:#2d2d33}}
:root[data-theme="dark"]{--bg:#141416;--card:#1e1e22;--tx:#f2f2f4;--mut:#9a9aa3;--ac2:#2c1d15;--bd:#2d2d33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 90px}
header{text-align:center;padding:18px 0 8px}
.logo{display:block;width:190px;max-width:62%;height:auto;margin:0 auto 4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
:root[data-theme="dark"] .logo{filter:invert(1)}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header p{margin:6px auto 0;color:var(--mut);max-width:440px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;font-size:.9rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/5;background:var(--ac2);display:grid;place-items:center;font-size:3.2rem}
.ph img{width:100%;height:100%;object-fit:cover}
.ph{position:relative}
.ph.gal{display:block}
.slides{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;scroll-snap-align:center}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 3px}
.nav.prev{left:6px}
.nav.next{right:6px}
.cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem;padding:2px 8px;border-radius:99px;pointer-events:none}
.body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{margin:0;font-size:1rem}
.desc{margin:0;color:var(--mut);font-size:.82rem}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:.7rem;background:var(--ac2);color:var(--ac);padding:2px 8px;border-radius:99px}
details{font-size:.82rem;color:var(--mut)}
summary{cursor:pointer;color:var(--ac);font-weight:600}
details ul{margin:6px 0 0;padding-left:16px}
.price{font-weight:700;font-size:1.1rem;margin-top:auto}
.btn{display:block;text-align:center;text-decoration:none;background:var(--wa);color:#fff;font-weight:600;padding:10px;border-radius:12px;font-size:.9rem}
.custom{margin-top:22px;background:var(--ac2);border:1px dashed var(--ac);border-radius:16px;padding:18px;text-align:center}
.custom h2{margin:0 0 6px;font-size:1.15rem}
.custom p{margin:0 0 12px;color:var(--mut);font-size:.9rem}
.info{display:grid;gap:8px;margin-top:22px;color:var(--mut);font-size:.88rem}
.info div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--wa);color:#fff;text-decoration:none;font-weight:700;padding:13px 18px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
footer{text-align:center;color:var(--mut);font-size:.8rem;margin-top:26px}
</style>
</head>

/* ====================================== */

const wa = t => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(t)}`;
const money = n => "$" + n.toLocaleString("es-AR");
const $ = id => document.getElementById(id);
$("brand").textContent = CONFIG.marca;
$("tagline").textContent = CONFIG.frase;
$("prod").textContent = CONFIG.produccion;
$("ship").textContent = CONFIG.envios;
$("pay").textContent = CONFIG.pagos;
$("foot").innerHTML = `${CONFIG.marca} · <a href="${CONFIG.instagramUrl}" target="_blank" rel="noopener" style="color:inherit">${CONFIG.instagram}</a>`;
document.title = CONFIG.marca + " · Catálogo";
$("fab").href = wa("Hola, vi tu catálogo y quiero hacer una consulta.");
$("customBtn").href = wa("Hola, quiero pedir un diseño personalizado. Mi idea es: ");

const cats = ["Todos", ...new Set(PRODUCTOS.map(p => p.cat))];
let sel = "Todos";
function ph(p){
  if(p.fotos && p.fotos.length>1) return `<div class="ph gal"><div class="slides">${p.fotos.map(f => `<img src="${f}" alt="${p.nombre}">`).join("")}</div><button class="nav prev" data-dir="-1" aria-label="Foto anterior">‹</button><button class="nav next" data-dir="1" aria-label="Foto siguiente">›</button><span class="cnt">1/${p.fotos.length}</span></div>`;
  const f = p.foto || (p.fotos && p.fotos[0]);
  return `<div class="ph">${f ? `<img src="${f}" alt="${p.nombre}">` : p.emoji}</div>`;
}
function render(){
  $("chips").innerHTML = cats.map(c => `<button class="chip ${c===sel?"on":""}" data-c="${c}">${c}</button>`).join("");
  $("grid").innerHTML = PRODUCTOS.filter(p => sel==="Todos" || p.cat===sel).map(p => `
    <article class="card">
      ${ph(p)}
      <div class="body">
        <h3>${p.nombre}</h3>
        <p class="desc">${p.desc}</p>
        <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
        ${p.mas ? `<details><summary>Ver detalles</summary><ul>${p.mas.map(m => `<li>${m}</li>`).join("")}</ul></details>` : ""}
        <div class="price"${p.precioTxt?' style="font-size:.9rem"':""}>${p.precioTxt || (p.precio ? money(p.precio) : "Consultar precio")}</div>
        <a class="btn" target="_blank" rel="noopener" href="${wa(p.msg || `Hola, quiero pedir: ${p.nombre}${p.precio ? " (" + money(p.precio) + ")" : ""}. ¿Tienen disponible?`)}">Pedir por WhatsApp</a>
      </div>
    </article>`).join("");
}
$("chips").addEventListener("click", e => {
  const c = e.target.dataset.c;
  if(c){ sel = c; render(); }
});
$("grid").addEventListener("scroll", e => {
  const t = e.target;
  if(t.classList && t.classList.contains("slides")){
    const i = Math.round(t.scrollLeft / t.clientWidth);
    t.parentNode.querySelector(".cnt").textContent = (i+1) + "/" + t.children.length;
  }
}, true);
$("grid").addEventListener("click", e => {
  const b = e.target.closest(".nav");
  if(!b) return;
  const sl = b.parentNode.querySelector(".slides");
  const n = sl.children.length;
  let i = Math.round(sl.scrollLeft / sl.clientWidth) + Number(b.dataset.dir);
  if(i < 0) i = n - 1;
  if(i >= n) i = 0;
  sl.scrollTo({left: i * sl.clientWidth, behavior: "smooth"});
});
render();
</script>
</body>
